name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect toolchain
        run: xcodebuild -version && swift --version
      - name: Check public files and history
        run: zsh scripts/check-publication.sh
      - name: Verify travel pipeline with fixtures
        run: zsh scripts/check-travel-pipeline.sh
      - name: Verify visual themes and HTTP recovery
        run: |
          zsh scripts/check-plan-themes.sh
          zsh scripts/check-http-recovery.sh
      - name: Build iOS simulator app
        run: >-
          xcodebuild -project DreamTravelMobile.xcodeproj
          -scheme DreamTravelMobile -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath /tmp/DreamTravelCI CODE_SIGNING_ALLOWED=NO build -quiet
